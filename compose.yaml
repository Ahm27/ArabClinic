services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__ArabClinic: "Data Source=tcp:db,1433;Initial Catalog=MediCare;User ID=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}

    volumes:
      - sqlserver_data:/var/opt/mssql

    ports:
      - "1433:1433"

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    restart: unless-stopped

volumes:
  sqlserver_data: